[package]
name = "finn"
version = "0.2.1"
description = "Finn Pentest Harness desktop"
authors = ["Finn"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "finn_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2.2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2.2"
tauri-plugin-shell = "2.2"
tauri-plugin-dialog = "2.2"
tauri-plugin-clipboard-manager = "2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
is_elevated = "0.1"
