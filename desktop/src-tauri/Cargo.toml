[package]
name = "finn"
version = "0.2.0"
description = "Finn Pentest Harness desktop"
authors = ["Finn"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "finn_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "2.2"

[dependencies]
tauri = { version = "2.2", features = ["tray-icon"] }
tauri-plugin-notification = "2.2"
tauri-plugin-global-shortcut = "2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
