# Host-network Penpot stack for environments where Docker bridge L2 is broken.
# Usage: docker compose -f docker-compose.host.yaml up -d

x-flags: &penpot-flags
  # MCP disabled here: host-network mode cannot resolve penpot-mcp DNS.
  PENPOT_FLAGS: disable-email-verification enable-smtp enable-prepl-server disable-secure-session-cookies enable-login-with-password enable-registration enable-demo-users

x-uri: &penpot-public-uri
  PENPOT_PUBLIC_URI: http://localhost:9001

x-secret-key: &penpot-secret-key
  PENPOT_SECRET_KEY: nil-local-dev-secret-key-change-me-in-prod-please-use-random

volumes:
  penpot_postgres_v15:
  penpot_assets:

services:
  penpot-postgres:
    image: postgres:15
    restart: unless-stopped
    network_mode: host
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U penpot -h 127.0.0.1"]
      interval: 2s
      timeout: 10s
      retries: 10
      start_period: 2s
    volumes:
      - penpot_postgres_v15:/var/lib/postgresql/data
    environment:
      - POSTGRES_INITDB_ARGS=--data-checksums
      - POSTGRES_DB=penpot
      - POSTGRES_USER=penpot
      - POSTGRES_PASSWORD=penpot
      - POSTGRES_HOST_AUTH_METHOD=trust

  penpot-valkey:
    image: valkey/valkey:8.1
    restart: unless-stopped
    network_mode: host
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -h 127.0.0.1 ping | grep PONG"]
      interval: 1s
      timeout: 3s
      retries: 10
      start_period: 3s
    environment:
      - VALKEY_EXTRA_FLAGS=--maxmemory 128mb --maxmemory-policy volatile-lfu

  penpot-mailcatch:
    image: sj26/mailcatcher:latest
    restart: unless-stopped
    network_mode: host

  penpot-backend:
    image: penpotapp/backend:2.16
    restart: unless-stopped
    network_mode: host
    volumes:
      - penpot_assets:/opt/data/assets
    depends_on:
      penpot-postgres:
        condition: service_healthy
      penpot-valkey:
        condition: service_healthy
    environment:
      <<: [*penpot-flags, *penpot-public-uri, *penpot-secret-key]
      PENPOT_DATABASE_URI: postgresql://127.0.0.1/penpot
      PENPOT_DATABASE_USERNAME: penpot
      PENPOT_DATABASE_PASSWORD: penpot
      PENPOT_REDIS_URI: redis://127.0.0.1/0
      PENPOT_OBJECTS_STORAGE_BACKEND: fs
      PENPOT_OBJECTS_STORAGE_FS_DIRECTORY: /opt/data/assets
      PENPOT_TELEMETRY_ENABLED: "false"
      PENPOT_SMTP_DEFAULT_FROM: no-reply@example.com
      PENPOT_SMTP_DEFAULT_REPLY_TO: no-reply@example.com
      PENPOT_SMTP_HOST: 127.0.0.1
      PENPOT_SMTP_PORT: 1025
      PENPOT_SMTP_TLS: "false"
      PENPOT_SMTP_SSL: "false"
      PENPOT_HTTP_SERVER_PORT: 6060

  penpot-exporter:
    image: penpotapp/exporter:2.16
    restart: unless-stopped
    network_mode: host
    depends_on:
      penpot-valkey:
        condition: service_healthy
    environment:
      <<: [*penpot-secret-key, *penpot-public-uri]
      PENPOT_INTERNAL_URI: http://127.0.0.1:8080
      PENPOT_REDIS_URI: redis://127.0.0.1/0

  penpot-frontend:
    image: penpotapp/frontend:2.16
    restart: unless-stopped
    network_mode: host
    volumes:
      - penpot_assets:/opt/data/assets
    depends_on:
      - penpot-backend
      - penpot-exporter
    environment:
      <<: [*penpot-flags, *penpot-public-uri]
      PENPOT_BACKEND_URI: http://127.0.0.1:6060
      PENPOT_EXPORTER_URI: http://127.0.0.1:6061
      PENPOT_DISABLE_IPV6_LISTEN: "true"
