<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img">
  <title>NIL Flows Board</title>
  <defs>
    <style>
      .sans { font-family: Inter, "SF Pro Text", system-ui, sans-serif; }
      .mono { font-family: "JetBrains Mono", ui-monospace, monospace; }
      .micro { font-family: Inter, system-ui, sans-serif; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; fill: #55554f; }
    </style>
  </defs>
  <rect x="0" y="0" width="1280" height="800" rx="0" fill="#050507" fill-opacity="1" />
  <text x="40" y="48" class="sans" font-size="20" font-weight="600" fill="#e8e8e6" text-anchor="start">03 Flows  ·  Agent loop / Approval / YOLO</text>
  <rect x="40" y="100" width="150" height="56" rx="6" fill="#0a0a0e" fill-opacity="1" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="115" y="134" class="sans" font-size="13" font-weight="600" fill="#e8e8e6" text-anchor="middle">User task</text>
  <line x1="190" y1="128" x2="210" y2="128" stroke="#55554f" stroke-width="1.5"/>
  <rect x="220" y="100" width="150" height="56" rx="6" fill="#0a0a0e" fill-opacity="1" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="295" y="134" class="sans" font-size="13" font-weight="600" fill="#a9b1f0" text-anchor="middle">Plan block</text>
  <line x1="370" y1="128" x2="390" y2="128" stroke="#55554f" stroke-width="1.5"/>
  <rect x="400" y="100" width="150" height="56" rx="6" fill="#0a0a0e" fill-opacity="1" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="475" y="134" class="sans" font-size="13" font-weight="600" fill="#00d992" text-anchor="middle">Tool block</text>
  <line x1="550" y1="128" x2="570" y2="128" stroke="#55554f" stroke-width="1.5"/>
  <rect x="580" y="100" width="150" height="56" rx="6" fill="#0a0a0e" fill-opacity="1" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="655" y="134" class="sans" font-size="13" font-weight="600" fill="#fe6f69" text-anchor="middle">Approval</text>
  <line x1="730" y1="128" x2="750" y2="128" stroke="#55554f" stroke-width="1.5"/>
  <rect x="760" y="100" width="150" height="56" rx="6" fill="#0a0a0e" fill-opacity="1" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="835" y="134" class="sans" font-size="13" font-weight="600" fill="#5cb8ff" text-anchor="middle">Verify</text>
  <line x1="910" y1="128" x2="930" y2="128" stroke="#55554f" stroke-width="1.5"/>
  <rect x="940" y="100" width="150" height="56" rx="6" fill="#0a0a0e" fill-opacity="1" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="1015" y="134" class="sans" font-size="13" font-weight="600" fill="#e8e8e6" text-anchor="middle">Summarize</text>
  <text x="40" y="200" class="sans" font-size="14" font-weight="600" fill="#e8e8e6" text-anchor="start">Approval detail</text>
  <text x="40" y="228" class="sans" font-size="12" font-weight="400" fill="#9a9a94" text-anchor="start">Finn proposes dangerous command → pulsing coral border → Approve runs &amp; logs · Edit rewrites · Reject adjusts plan</text>
  <text x="40" y="280" class="sans" font-size="14" font-weight="600" fill="#e8e8e6" text-anchor="start">Space switch (⌘1…9)</text>
  <text x="40" y="308" class="sans" font-size="12" font-weight="400" fill="#9a9a94" text-anchor="start">Instant swap of sidebar + conversation + inspector + status · spring-window 300ms</text>
  <text x="40" y="360" class="sans" font-size="14" font-weight="600" fill="#e8e8e6" text-anchor="start">YOLO toggle</text>
  <rect x="40" y="380" width="72" height="24" rx="4" fill="#16161d" fill-opacity="1" stroke="#452a84" stroke-width="1"/>
  <text x="76" y="396" class="mono" font-size="11" font-weight="600" fill="#a9b1f0" text-anchor="middle">SAFE</text>
  <text x="130" y="396" class="sans" font-size="14" font-weight="400" fill="#55554f" text-anchor="start">→</text>
  <rect x="160" y="380" width="72" height="24" rx="4" fill="#fe6f69" fill-opacity="1" />
  <text x="196" y="396" class="mono" font-size="11" font-weight="600" fill="#f5f2ec" text-anchor="middle">YOLO</text>
  <text x="40" y="430" class="sans" font-size="12" font-weight="400" fill="#9a9a94" text-anchor="start">Auto-approves subsequent tools · still rendered as blocks · still logged · never animated cute</text>
</svg>
