<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img">
  <title>NIL Command Palette Wireframe</title>
  <defs>
    <style>
      .sans { font-family: Inter, "SF Pro Text", system-ui, sans-serif; }
      .mono { font-family: "JetBrains Mono", ui-monospace, monospace; }
      .micro { font-family: Inter, system-ui, sans-serif; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; fill: #55554f; }
    </style>
  </defs>
  <rect x="0" y="0" width="1440" height="900" rx="0" fill="#050507" fill-opacity="1" />
  <rect x="0" y="0" width="1440" height="40" rx="0" fill="#101016" fill-opacity="0.5" />
  <rect x="0" y="40" width="280" height="834" rx="0" fill="#0a0a0c" fill-opacity="0.35" />
  <rect x="1120" y="40" width="320" height="834" rx="0" fill="#0a0a0c" fill-opacity="0.35" />
  <rect x="0" y="0" width="1440" height="900" rx="0" fill="#000000" fill-opacity="0.45" />
  <rect x="360" y="160" width="720" height="420" rx="12" fill="#0a0a0e" fill-opacity="1" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <rect x="360" y="160" width="720" height="52" rx="0" fill="#101016" fill-opacity="1" />
  <rect x="360" y="160" width="720" height="52" rx="0" fill="#101016" fill-opacity="1" />
  <text x="384" y="192" class="sans" font-size="14" font-weight="400" fill="#55554f" text-anchor="start">Ask NIL or run a command…</text>
  <text x="1040" y="192" class="mono" font-size="12" font-weight="400" fill="#55554f" text-anchor="start">⌘K</text>
  <line x1="360" y1="212" x2="1080" y2="212" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="384" y="244" class="sans" font-size="11" font-weight="500" fill="#55554f" text-anchor="start">COMMANDS</text>
  <rect x="372" y="256" width="696" height="32" rx="4" fill="#16161d" fill-opacity="1" />
  <text x="388" y="276" class="sans" font-size="13" font-weight="400" fill="#e8e8e6" text-anchor="start">New engagement</text>
  <text x="1000" y="276" class="mono" font-size="11" font-weight="400" fill="#55554f" text-anchor="start">⌘N</text>
  <text x="388" y="316" class="sans" font-size="13" font-weight="400" fill="#9a9a94" text-anchor="start">Toggle sidebar</text>
  <text x="1000" y="316" class="mono" font-size="11" font-weight="400" fill="#55554f" text-anchor="start">⌘B</text>
  <text x="388" y="348" class="sans" font-size="13" font-weight="400" fill="#9a9a94" text-anchor="start">Open settings</text>
  <text x="1000" y="348" class="mono" font-size="11" font-weight="400" fill="#55554f" text-anchor="start">⌘,</text>
  <text x="384" y="392" class="sans" font-size="11" font-weight="500" fill="#55554f" text-anchor="start">SPACES</text>
  <text x="388" y="420" class="sans" font-size="13" font-weight="400" fill="#9a9a94" text-anchor="start">acme-corp</text>
  <text x="1000" y="420" class="mono" font-size="11" font-weight="400" fill="#55554f" text-anchor="start">⌘1</text>
  <text x="388" y="452" class="sans" font-size="13" font-weight="400" fill="#9a9a94" text-anchor="start">lab-sandbox</text>
  <text x="1000" y="452" class="mono" font-size="11" font-weight="400" fill="#55554f" text-anchor="start">⌘2</text>
  <text x="384" y="496" class="sans" font-size="11" font-weight="500" fill="#55554f" text-anchor="start">TOOLS</text>
  <text x="388" y="524" class="sans" font-size="13" font-weight="400" fill="#9a9a94" text-anchor="start">Run nmap on selected target</text>
  <text x="388" y="556" class="sans" font-size="13" font-weight="400" fill="#9a9a94" text-anchor="start">Run nuclei (requires approval)</text>
  <text x="12" y="864" class="sans" font-size="11" font-weight="400" fill="#55554f" text-anchor="start">02 Layouts  ·  Command Palette (⌘K)</text>
</svg>
