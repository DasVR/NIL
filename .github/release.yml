# GitHub Release notes configuration
# https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes

changelog:
  exclude:
    labels:
      - ignore-for-release
      - dependencies
  categories:
    - title: Features
      labels:
        - feature
        - enhancement
    - title: Bug fixes
      labels:
        - bug
        - fix
    - title: UI & polish
      labels:
        - ui
        - polish
    - title: Documentation
      labels:
        - documentation
        - docs
    - title: Other
      labels:
        - "*"
