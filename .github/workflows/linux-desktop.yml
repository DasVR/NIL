name: Linux desktop

on:
  push:
    branches: [master, cursor/**]
  pull_request:
  workflow_dispatch:

concurrency:
  group: linux-desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-check:
    name: Frontend check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check and build
        run: |
          npm run check
          npm run build

  package:
    name: Package Linux AppImage + deb
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Tauri packaging tree
        id: tauri
        run: |
          if [ -d desktop ] && [ -d web ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No web/desktop trees in this repo; skipping Tauri packaging."
          fi

      - name: Install Node.js
        if: steps.tauri.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json

      - name: Install Rust
        if: steps.tauri.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system deps
        if: steps.tauri.outputs.present == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Cache Rust
        if: steps.tauri.outputs.present == 'true'
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install JS dependencies
        if: steps.tauri.outputs.present == 'true'
        run: |
          npm ci --prefix web
          npm ci --prefix desktop

      - name: Build Linux packages
        if: steps.tauri.outputs.present == 'true'
        working-directory: desktop
        env:
          CI: true
        run: |
          for i in 1 2 3; do
            echo "Build attempt $i..."
            if npm run tauri -- build --bundles appimage,deb; then
              echo "Build succeeded on attempt $i"
              break
            fi
            echo "Build attempt $i failed; waiting 60s before retry..."
            sleep 60
          done

      - name: Name AppImage Finn-Setup.AppImage
        if: steps.tauri.outputs.present == 'true'
        run: |
          mkdir -p dist-installers
          img="$(ls desktop/src-tauri/target/release/bundle/appimage/*.AppImage | head -1 || true)"
          if [[ -n "$img" ]]; then
            cp "$img" dist-installers/Finn-Setup.AppImage
            chmod +x dist-installers/Finn-Setup.AppImage
          fi
          deb="$(ls desktop/src-tauri/target/release/bundle/deb/*.deb | head -1 || true)"
          if [[ -n "$deb" ]]; then cp "$deb" dist-installers/Finn-Setup.deb; fi

      - name: Upload Linux packages
        if: steps.tauri.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Finn-Setup-Linux-${{ github.sha }}
          path: |
            dist-installers/Finn-Setup.AppImage
            dist-installers/Finn-Setup.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: warn
          retention-days: 14

  python-package:
    name: Wheel, installer syntax, pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e ".[dev]"
          bash -n install/unix/install.sh
          bash -n install/macos/make-pkg.sh
          bash -n install/macos/make-app.sh
          bash -n install/macos/pkg-scripts/postinstall
          python -m pytest tests -q
          python -m build --wheel
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finn-api-wheel-${{ github.sha }}
          path: |
            dist/*.whl
            install/unix/install.sh
            install/windows/install.ps1
            install/windows/setup.cmd
            install/run-api.py
            install/wizard.py
            install/engine.py
            install/palette.py
            install/macos/**
          if-no-files-found: warn
          retention-days: 14
