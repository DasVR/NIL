name: Linux desktop

on:
  push:
    branches: [master, cursor/**]
  pull_request:
  workflow_dispatch:

concurrency:
  group: linux-desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package Linux AppImage + deb
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install JS dependencies
        run: |
          npm ci --prefix web
          npm ci --prefix desktop

      - name: Build Linux packages
        working-directory: desktop
        env:
          CI: true
        run: |
          for i in 1 2 3; do
            echo "Build attempt $i..."
            if npm run tauri -- build --bundles appimage,deb; then
              echo "Build succeeded on attempt $i"
              break
            fi
            echo "Build attempt $i failed; waiting 60s before retry..."
            sleep 60
          done

      - name: Upload Linux packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finn-linux-${{ github.sha }}
          path: |
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: warn
          retention-days: 14

  python-package:
    name: Wheel, installer syntax, pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e ".[dev]"
          bash -n install/finn-install.sh
          python -m pytest tests -q
          python -m build --wheel
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finn-python-${{ github.sha }}
          path: |
            dist/*.whl
            install/finn-install.sh
            install/finn-install.ps1
            install/run-api.py
          if-no-files-found: warn
          retention-days: 14
