name: macOS desktop

on:
  push:
    branches: [master, cursor/**]
  pull_request:
  workflow_dispatch:

concurrency:
  group: macos-desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A job-level `if: hashFiles(...)` is evaluated BEFORE checkout, so it always
  # sees an empty workspace and the packaging job is silently skipped forever
  # (a green run that never built anything). This cheap job checks out first and
  # reports honestly whether the Tauri desktop tree exists.
  detect:
    name: Detect desktop tree
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f desktop/src-tauri/tauri.conf.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Desktop Tauri tree present; macOS packaging will run."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No desktop/src-tauri/tauri.conf.json; skipping macOS packaging."
          fi

  package-and-launch:
    name: Package .app and launch
    needs: detect
    if: needs.detect.outputs.present == 'true'
    runs-on: macos-latest
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install JS dependencies
        run: |
          npm ci --prefix frontend
          npm ci --prefix desktop

      - name: Package macOS app and DMG
        working-directory: desktop
        env:
          CI: true
        run: npm run tauri -- build --bundles app,dmg

      - name: Launch smoke test
        run: bash desktop/scripts/macos-launch-smoke.sh

      - name: Build installers (Setup.app, .pkg, Setup DMG, kit zip)
        run: bash desktop/scripts/macos-zip-app.sh

      - name: Upload macOS installers
        uses: actions/upload-artifact@v4
        with:
          name: NIL-macOS-${{ github.sha }}
          path: |
            desktop/src-tauri/target/release/bundle/macos/Finn-Setup.pkg
            desktop/src-tauri/target/release/bundle/macos/Finn-Setup.dmg
            desktop/src-tauri/target/release/bundle/macos/*.zip
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: warn
          retention-days: 14
