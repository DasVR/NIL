name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1). Leave empty for a test build."
        required: false
        type: string
      build_only:
        description: "Build artifacts only — do NOT publish a GitHub Release."
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build-python-wheel:
    name: Python wheel + frontend bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build frontend
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend

      - name: Build Python wheel
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e ".[dev]"
          python -m build --wheel

      - name: Prepare release assets
        run: |
          mkdir -p dist
          cp dist/*.whl dist/ || true
          cp -r frontend/build dist/web-ui || true
          cp install/unix/install.sh dist/ || true
          cp install/windows/install.ps1 dist/ || true
          cp install/windows/setup.cmd dist/ || true
          cp install/run-api.py dist/ || true
          ls -lah dist/

      - uses: actions/upload-artifact@v4
        with:
          name: nil-release
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build-python-wheel
    if: >-
      always()
      && !cancelled()
      && needs.build-python-wheel.result == 'success'
      && (github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.tag != ''))
      && (github.event_name != 'workflow_dispatch' || inputs.build_only != true)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: nil-release
          path: dist

      - name: Write release notes
        run: |
          TAG="${RELEASE_TAG}"
          PREV=$(git tag --sort=-v:refname | grep -E '^v[0-9]' | grep -v "^${TAG}$" | head -1 || true)
          {
            echo "# NIL ${TAG}"
            echo ""
            echo "> Web-first AI coding/pentest workstation. Python API + SvelteKit frontend."
            echo ""
            echo "## Download"
            echo ""
            echo "| File | Purpose |"
            echo "| --- | --- |"
            echo "| \`*.whl\` | Python package — install with pip |"
            echo "| \`web-ui/\` | Static SvelteKit build |"
            echo "| \`install.sh\` | Unix install script |"
            echo "| \`install.ps1\` | Windows install script |"
            echo "| \`setup.cmd\` | Windows quick launcher |"
            echo ""
            echo "## Quick start"
            echo ""
            echo "\`\`\`bash"
            echo "pip install finn_pentest-*.whl"
            echo "python -m finn_pentest.cli.main run-api"
            echo "# open http://localhost:8000"
            echo "\`\`\`"
            echo ""
            echo "## Changes since ${PREV:-initial release}"
            echo ""
            if [ -n "$PREV" ]; then
              git log "${PREV}..HEAD" --pretty=format:'- %s (`%h`)' --no-merges || true
            else
              git log -15 --pretty=format:'- %s (`%h`)' --no-merges || true
            fi
            echo ""
            echo ""
            echo "---"
            echo "*Use only against systems you are authorized to test.*"
          } > release-notes.md
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: NIL ${{ env.RELEASE_TAG }}
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          generate_release_notes: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
