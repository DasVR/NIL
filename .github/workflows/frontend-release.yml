name: Frontend Test Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.2.0-test.1). Leave empty for a test build.'
        required: false
        type: string
      build_only:
        description: 'Build artifacts only — do NOT publish a GitHub Release.'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build-frontend:
    name: Build NIL static frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint / check / build
        run: |
          npm run check
          npm run build

      - name: Package frontend
        run: |
          # Stage a flat, obvious release layout: build/ + run scripts at root
          STAGE="nil-frontend-${RELEASE_TAG}"
          mkdir -p "${STAGE}" dist
          cp -r build "${STAGE}/build"
          cp run.sh run.bat run.ps1 "NIL Frontend.command" "${STAGE}/"
          chmod +x "${STAGE}/run.sh" "${STAGE}/NIL Frontend.command"
          (cd "${STAGE}" && zip -r "../dist/nil-frontend-${RELEASE_TAG}.zip" .)
          tar -czf "dist/nil-frontend-${RELEASE_TAG}.tar.gz" "${STAGE}"
          # Also ship a plain web-only zip (just build/) for people who only want the site
          (cd build && zip -r "../dist/nil-frontend-${RELEASE_TAG}-webonly.zip" .)
          ls -lah dist/

      - uses: actions/upload-artifact@v4
        with:
          name: nil-frontend-${{ env.RELEASE_TAG }}
          path: frontend/dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build-frontend
    if: >-
      always()
      && !cancelled()
      && needs.build-frontend.result == 'success'
      && (github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.tag != ''))
      && (github.event_name != 'workflow_dispatch' || inputs.build_only != true)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: nil-frontend-${{ env.RELEASE_TAG }}
          path: release-assets

      - name: Write release notes
        run: |
          TAG="${RELEASE_TAG}"
          PREV=$(git tag --sort=-v:refname | grep -E '^v[0-9]' | grep -v "^${TAG}$" | head -1 || true)
          {
            echo "# NIL Frontend ${TAG}"
            echo ""
            echo "Terminal-first coding agent UI — static build + local server."
            echo ""
            echo "## Run locally"
            echo '```bash'
            echo "unzip nil-frontend-${TAG}.zip"
            echo "cd nil-frontend-${TAG}"
            echo "# Windows:"
            echo "./run.bat     (or .\run.ps1 in PowerShell)"
            echo "# macOS / Linux / Git Bash:"
            echo "./run.sh"
            echo "then open http://localhost:3000"
            echo '```'
            echo ""
            echo "## Changes since ${PREV:-initial release}"
            if [ -n "$PREV" ]; then
              git log "${PREV}..HEAD" --pretty=format:'- %s (`%h`)' --no-merges || true
            else
              git log -10 --pretty=format:'- %s (`%h`)' --no-merges || true
            fi
            echo ""
          } > release-notes.md
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: NIL Frontend ${{ env.RELEASE_TAG }}
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
