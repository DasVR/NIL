name: Windows desktop

on:
  push:
    branches: [master, cursor/**]
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # See macos-desktop.yml: a job-level hashFiles() gate runs before checkout and
  # skips forever. Detect the tree in a cheap job that checks out first.
  detect:
    name: Detect desktop tree
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f desktop/src-tauri/tauri.conf.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Desktop Tauri tree present; Windows packaging will run."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No desktop/src-tauri/tauri.conf.json; skipping Windows packaging."
          fi

  package:
    name: Package Windows installer
    needs: detect
    if: needs.detect.outputs.present == 'true'
    runs-on: windows-latest
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install JS dependencies
        run: |
          npm ci --prefix frontend
          npm ci --prefix desktop
        shell: bash

      - name: Build Windows installer
        working-directory: desktop
        env:
          CI: true
        # Host target on windows-latest is x86_64-pc-windows-msvc; leaving --target off
        # keeps outputs under target/release, which the smoke script expects.
        run: npm run tauri -- build --bundles nsis,msi
        shell: bash

      # Installer file names follow install/catalog.json (Finn-Setup.*), same as the
      # macOS lane. Missing installers fail here rather than producing an empty artifact.
      - name: Name the installers Finn-Setup.exe / Finn-Setup.msi
        shell: bash
        run: |
          bundle=desktop/src-tauri/target/release/bundle
          mkdir -p dist-installers
          exe="$(ls "$bundle"/nsis/*.exe | head -1)"
          msi="$(ls "$bundle"/msi/*.msi | head -1)"
          test -s "$exe" || { echo "NSIS installer missing"; exit 1; }
          test -s "$msi" || { echo "MSI installer missing"; exit 1; }
          cp "$exe" dist-installers/Finn-Setup.exe
          cp "$msi" dist-installers/Finn-Setup.msi
          ls -la dist-installers

      # Uploaded before the smoke so QA still gets installers when a smoke phase fails.
      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: NIL-Windows-${{ github.sha }}
          path: |
            dist-installers/Finn-Setup.exe
            dist-installers/Finn-Setup.msi
          if-no-files-found: error
          retention-days: 14

      # Each smoke phase is its own step with a hard timeout so a stuck installer
      # fails fast with a process snapshot instead of hanging the job.
      - name: Smoke - launch NIL.exe
        shell: pwsh
        timeout-minutes: 5
        run: ./desktop/scripts/windows-smoke.ps1 -Phase launch -Root (Get-Location).Path

      - name: Smoke - NSIS install round-trip
        shell: pwsh
        timeout-minutes: 10
        run: ./desktop/scripts/windows-smoke.ps1 -Phase nsis -Root (Get-Location).Path -InstallTimeoutSeconds 180

      - name: Smoke - MSI install round-trip
        shell: pwsh
        timeout-minutes: 10
        run: ./desktop/scripts/windows-smoke.ps1 -Phase msi -Root (Get-Location).Path -InstallTimeoutSeconds 180
