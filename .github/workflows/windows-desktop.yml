name: Windows desktop

on:
  push:
    branches: [master, cursor/**]
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package Windows installer
    if: hashFiles('desktop/src-tauri/tauri.conf.json') != ''
    runs-on: windows-latest
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Tauri packaging tree
        id: tauri
        shell: bash
        run: |
          if [ -d desktop ] && [ -d web ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No web/desktop trees in this repo; skipping Tauri packaging."
          fi

      - name: Install Node.js
        if: steps.tauri.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json

      - name: Install Rust
        if: steps.tauri.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        if: steps.tauri.outputs.present == 'true'
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install JS dependencies
        if: steps.tauri.outputs.present == 'true'
        run: |
          npm ci --prefix web
          npm ci --prefix desktop
        shell: bash

      - name: Build Windows installer
        if: steps.tauri.outputs.present == 'true'
        working-directory: desktop
        env:
          CI: true
        run: npm run tauri -- build --bundles nsis,msi
        shell: bash

      - name: Name the NSIS file Finn-Setup.exe
        if: steps.tauri.outputs.present == 'true'
        shell: bash
        run: |
          mkdir -p dist-installers
          exe="$(ls desktop/src-tauri/target/release/bundle/nsis/*.exe | head -1)"
          cp "$exe" dist-installers/Finn-Setup.exe
          msi="$(ls desktop/src-tauri/target/release/bundle/msi/*.msi | head -1 || true)"
          if [[ -n "$msi" ]]; then cp "$msi" dist-installers/Finn-Setup.msi; fi

      - name: Upload Windows packages
        if: steps.tauri.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Finn-Setup-Windows-${{ github.sha }}
          path: |
            dist-installers/Finn-Setup.exe
            dist-installers/Finn-Setup.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
          retention-days: 14
