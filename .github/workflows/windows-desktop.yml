name: Windows desktop

on:
  push:
    branches: [master, cursor/**]
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # See macos-desktop.yml: a job-level hashFiles() gate runs before checkout and
  # skips forever. Detect the tree in a cheap job that checks out first.
  detect:
    name: Detect desktop tree
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f desktop/src-tauri/tauri.conf.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Desktop Tauri tree present; Windows packaging will run."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No desktop/src-tauri/tauri.conf.json; skipping Windows packaging."
          fi

  package:
    name: Package Windows installer
    needs: detect
    if: needs.detect.outputs.present == 'true'
    runs-on: windows-latest
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install JS dependencies
        run: |
          npm ci --prefix frontend
          npm ci --prefix desktop
        shell: bash

      - name: Build Windows installer
        working-directory: desktop
        env:
          CI: true
        run: npm run tauri -- build --bundles nsis,msi
        shell: bash

      - name: Name the NSIS file Finn-Setup.exe
        shell: bash
        run: |
          mkdir -p dist-installers
          exe="$(ls desktop/src-tauri/target/release/bundle/nsis/*.exe | head -1)"
          cp "$exe" dist-installers/Finn-Setup.exe
          msi="$(ls desktop/src-tauri/target/release/bundle/msi/*.msi | head -1 || true)"
          if [[ -n "$msi" ]]; then cp "$msi" dist-installers/Finn-Setup.msi; fi

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: NIL-Windows-${{ github.sha }}
          path: |
            dist-installers/Finn-Setup.exe
            dist-installers/Finn-Setup.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
          retention-days: 14
