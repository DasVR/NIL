name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
    paths: ['frontend/**', '.github/workflows/github-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build NIL frontend for GitHub Pages
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        env:
          # This is a project page (dasvr.github.io/NIL/), not a user/org page, so every
          # asset path SvelteKit emits — in index.html AND in the inline bootstrap JS that
          # dynamically imports the app chunks — needs this prefix baked in at build time.
          # A post-build sed on index.html alone doesn't reach those inline imports and
          # silently 404s every JS module (blank page, nothing in the DOM to inspect).
          BASE_PATH: /${{ github.event.repository.name }}
        run: |
          npm run check
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
