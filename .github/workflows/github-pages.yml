name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
    paths: ['frontend/**', '.github/workflows/github-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build NIL frontend for GitHub Pages
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: |
          npm run check
          npm run build

      - name: Adjust paths for GitHub Pages
        run: |
          # SvelteKit static adapter writes absolute paths; for a project page we need relative.
          # Replace absolute href/src in index.html with relative paths for the root path.
          sed -i 's|href="/|href="./|g; s|src="/|src="./|g' build/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
